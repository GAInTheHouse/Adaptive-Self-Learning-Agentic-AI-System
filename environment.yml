name: stt-genai
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.9

  # System utilities
  - git-lfs
  - ffmpeg
  
  # Core ML libraries (from conda when possible for better compatibility)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - torchaudio>=2.0.0
  
  # Audio processing
  - libsndfile
  - librosa>=0.10.0
  
  # Data processing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - scipy>=1.11.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  
  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.65.0
  
  # Development tools
  - pytest>=7.4.0
  - black>=23.0.0
  - flake8>=6.0.0
  
  # Pip dependencies (packages not available via conda or better from pip)
  - pip
  - pip:
    # Hugging Face ecosystem
    - transformers>=4.35.0
    - accelerate>=0.24.0
    - datasets>=2.14.0
    - bitsandbytes>=0.40.0
    - peft>=0.8.0
    
    # Audio utilities
    - soundfile>=0.12.0
    - pydub>=0.25.0
    - audioread>=3.0.0
    - jiwer>=3.0.0
    - torchcodec>=0.1.0  # For VoxPopuli audio decoding
    
    # Google Cloud
    - google-cloud-storage>=2.10.0
    - gcsfs>=2023.6.0
    
    # Experiment tracking
    - wandb>=0.16.0
    
    # Utilities
    - python-dotenv>=1.0.0
    - ollama>=0.1.0
    
    # API
    - fastapi>=0.104.0
    - uvicorn>=0.24.0
    - python-multipart>=0.0.5
    
    # Other
    - importlib-metadata
